<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSJCET CodeCampus | Computer Department</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard">
        <span class="brand-logo">CC</span>
        <span>
          <strong>CodeCampus</strong>
          <small>SSJCET COMPUTER DEPT.</small>
        </span>
      </a>

      <div class="profile-summary">
        <div class="avatar">OS</div>
        <div>
          <strong id="sidebarUser">Om Shinde</strong>
          <small id="sidebarRole">Student</small>
        </div>
      </div>

      <p class="nav-heading">MAIN MENU</p>
      <nav id="navigation">
        <button class="nav-item active" data-page="dashboard"><span>▦</span> Dashboard</button>
        <button class="nav-item" data-page="attendance"><span>◷</span> Attendance</button>
        <button class="nav-item" data-page="marks"><span>▤</span> Marks &amp; Results</button>
        <button class="nav-item" data-page="assignments"><span>▣</span> Assignments</button>
        <button class="nav-item" data-page="timetable"><span>▦</span> Timetable</button>
        <button class="nav-item" data-page="notices"><span>♧</span> Department Notices</button>
        <button class="nav-item" data-page="people"><span>♙</span> People &amp; Classes</button>
        <button class="nav-item" data-page="approvals"><span>✓</span> Approvals</button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span>⚙</span> Settings</button>
        <div class="demo-note">
          <span class="status-dot"></span>
          Demo mode enabled
          <small>Sample data only</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuButton" class="icon-button mobile-menu" aria-label="Toggle menu">☰</button>
          <div>
            <p class="eyebrow">SHIVAJIRAO S. JONDHALE COLLEGE OF ENGINEERING</p>
            <h1 id="pageHeading">Dashboard</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <span class="demo-badge">● DEMO MODE</span>

          <!-- Light / Dark Mode Button -->
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            title="Switch to dark mode"
            aria-label="Switch to dark mode"
          >🌙</button>

          <button id="noticeButton" class="icon-button" title="Notices" aria-label="Open notices">♧</button>

          <button id="profileButton" class="profile-chip" type="button">
            <span class="avatar small-avatar">OS</span>
            <span id="headerUser">Om Shinde</span>
            <span>⌄</span>
          </button>
        </div>
      </header>

      <section id="pageContent" class="page-content" aria-live="polite"></section>

      <footer class="footer">
        SSJCET CodeCampus · Computer Department · Academic Demo Project
      </footer>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Details</h2>
        <button id="closeModal" class="icon-button" type="button" aria-label="Close dialog">✕</button>
      </div>
      <div id="modalBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
